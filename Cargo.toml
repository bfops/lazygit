[package]
name = "better-review"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "5.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.6"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.10"
